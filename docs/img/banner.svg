<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="CTF / CHO — AI-assisted CTF Workspace">
  <rect width="1000" height="280" fill="#000000"/>
  <!-- terminal window -->
  <rect x="40" y="36" width="920" height="208" rx="10" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="40" y="36" width="920" height="30" rx="10" fill="#101010"/>
  <rect x="40" y="56" width="920" height="10" fill="#101010"/>
  <circle cx="62" cy="51" r="5" fill="#2a2a2a"/>
  <circle cx="80" cy="51" r="5" fill="#2a2a2a"/>
  <circle cx="98" cy="51" r="5" fill="#2a2a2a"/>
  <text x="500" y="55" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#1f7a3a">cho@kali: ~/ctf</text>
  <!-- content -->
  <g font-family="Cascadia Mono, 'DejaVu Sans Mono', Consolas, monospace">
    <text x="70" y="108" font-size="34" font-weight="700" fill="#5de87d">CTF / CHO</text>
    <text x="70" y="140" font-size="15" fill="#33d457">AI-assisted Capture-the-Flag workspace — local AI, 100+ tools, one terminal.</text>
    <text x="70" y="186" font-size="15" fill="#1f7a3a">$</text>
    <text x="92" y="186" font-size="15" fill="#5de87d">cho analyze ./evidence.png</text>
    <text x="70" y="212" font-size="15" fill="#33d457">[*] forensics · metadata · base64 comment</text>
    <text x="70" y="212" font-size="15" fill="#33d457" opacity="0"> </text>
    <text x="430" y="212" font-size="15" fill="#5de87d">FLAG{look_beyond_the_pixels}</text>
    <rect x="690" y="200" width="9" height="16" fill="#33d457"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
